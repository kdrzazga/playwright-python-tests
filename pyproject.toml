[project]
name = "playwright-python-tests"
version = "0.1.0"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
base_url = "https://the-internet.herokuapp.com"
markers = [
    "smoke: fast critical-path checks, one per feature area",
    "negative: invalid input / error-path scenarios",
    "slow: tests that wait on deliberately delayed page behaviour",
    "home: home page and navigation",
    "auth: login and logout",
    "forms: checkboxes, dropdowns and add/remove elements",
    "alerts: JavaScript alert, confirm and prompt dialogs",
    "dynamic_loading: content rendered after an async load",
]
addopts = "--strict-markers --reruns 2 --reruns-delay 2 --screenshot only-on-failure --video retain-on-failure --tracing retain-on-failure --output test-results"
