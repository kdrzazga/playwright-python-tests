name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Check reachability of the site under test
        run: |
          for url in \
            https://the-internet.herokuapp.com/login \
            https://the-internet.herokuapp.com/js/vendor/298279967.js \
            https://the-internet.herokuapp.com/js/vendor/jquery-1.11.3.min.js \
            https://the-internet.herokuapp.com/js/vendor/jquery-ui-1.11.4/jquery-ui.js \
            https://the-internet.herokuapp.com/js/foundation/foundation.js \
            https://the-internet.herokuapp.com/css/app.css \
            https://log.optimizely.com/ \
            https://rum.optimizely.com/; do
            curl -s -o /dev/null --max-time 40 \
              -w "HTTP %{http_code}  dns %{time_namelookup}s  connect %{time_connect}s  total %{time_total}s  $url\n" "$url" \
              || echo "FAILED (curl exit $?)  $url"
          done

      - name: Run tests
        run: python -m pytest -m smoke --browser ${{ matrix.browser }} --junitxml=reports/junit-${{ matrix.browser }}.xml

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: |
            reports/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
