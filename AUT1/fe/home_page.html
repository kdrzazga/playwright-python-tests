<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Car Sales & Rental - Home</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script type="module" src="/js/home_page.js"></script>
</head>
<body>
<header class="top-bar">
    <span class="app-name">Car Sales & Rental</span>
    <button type="button" class="secondary-button" data-testid="logout-button">Log out</button>
</header>
<main class="page-content">
    <h1 data-testid="welcome-message">Welcome</h1>
    <div class="home-actions">
        <button type="button" class="primary-button" data-testid="show-whole-db-button" hidden>Show whole DB</button>
        <button type="button" class="primary-button" data-testid="vehicles-button" hidden>Vehicles</button>
    </div>
</main>
<footer class="session-footer" data-testid="session-footer" hidden>
    Logged in as <strong data-testid="footer-username"></strong> on <span data-testid="footer-login-time"></span>
</footer>
</body>
</html>
